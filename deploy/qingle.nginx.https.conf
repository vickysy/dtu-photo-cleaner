# 轻了相册官网 qingle.nativeailab.cn（有证书以后用这份）：HTTP 跳 HTTPS，文件在 /var/www/qingle
server {
    listen 80;
    server_name qingle.nativeailab.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://qingle.nativeailab.cn$request_uri; }
}
server {
    listen 443 ssl;
    server_name qingle.nativeailab.cn;
    ssl_certificate /etc/letsencrypt/live/qingle.nativeailab.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qingle.nativeailab.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/qingle;
    index index.html;
    charset utf-8;
    gzip_types text/css application/javascript image/svg+xml;

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location /img/ { expires 7d; }
    location /download/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }
    # 官网反馈表：只收 POST，交给本机的小程序（deploy/feedback/，systemd 服务 qingle-feedback）
    location = /api/feedback {
        limit_except POST { deny all; }
        client_max_body_size 16k;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header User-Agent $http_user_agent;
        proxy_read_timeout 10s;
        proxy_pass http://127.0.0.1:8792;
    }
}
