# 轻了相册官网 qingle.nativeailab.cn：纯静态页面 + 安装包，文件在 /var/www/qingle
# 第一步（还没有证书）：只开 80 端口；拿到证书后换成 deploy/qingle.nginx.https.conf
server {
    listen 80;
    server_name qingle.nativeailab.cn;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }

    root /var/www/qingle;
    index index.html;
    charset utf-8;
    gzip_types text/css application/javascript image/svg+xml;

    location = / { add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location / { try_files $uri $uri/ =404; }
    location /img/ { expires 7d; }
    location /download/ {
        types { application/vnd.android.package-archive apk; }
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }
}
